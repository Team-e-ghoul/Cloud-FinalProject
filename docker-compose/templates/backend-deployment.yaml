apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -c
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -c
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: DB_NAME
              value: testdb
            - name: DB_PASSWORD
              value: postgres
            - name: DB_USER
              value: postgres
            - name: PRIMARY_HOST
              value: primary
            - name: REPLICA_HOST
              value: replica
            - name: REPLICA_HOST2
              value: replica2
          image: k3rn3lpanicc/cc-final-backend:latest
          name: node-backend
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
