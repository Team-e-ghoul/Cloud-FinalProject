apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -c
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: primary
  name: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: primary
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -c
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: primary
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: testdb
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_USER
              value: postgres
          image: postgres:15
          name: pg-primary
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: primary-data
            - mountPath: /docker-entrypoint-initdb.d
              name: primary-cm1
      restartPolicy: Always
      volumes:
        - name: primary-data
          persistentVolumeClaim:
            claimName: primary-data
        - configMap:
            name: primary-cm1
          name: primary-cm1
