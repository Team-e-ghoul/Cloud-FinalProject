apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -c
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: replica
  name: replica
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: replica
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -c
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: replica
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: testdb
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_USER
              value: postgres
          image: postgres:15
          name: pg-replica
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: replica-data
            - mountPath: /docker-entrypoint-initdb.d
              name: replica-cm1
      restartPolicy: Always
      volumes:
        - name: replica-data
          persistentVolumeClaim:
            claimName: replica-data
        - configMap:
            name: replica-cm1
          name: replica-cm1
