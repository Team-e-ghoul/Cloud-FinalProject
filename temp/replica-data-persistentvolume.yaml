apiVersion: v1
kind: PersistentVolume
metadata:
  name: replica-data-pv
  labels:
    io.kompose.service: replica-data
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/data/replica
  claimRef:
    name: replica-data
    namespace: default
